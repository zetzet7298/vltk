<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wuxia Mobile ARPG HUD - Classic Style V2</title>
  <style>
    :root{
      --gold:#f3c464; --gold2:#8c541f; --jade:#6ef0d0; --blood:#c31818;
      --ink:#080705; --panel:rgba(10,8,5,.72); --asset:../Assets/UI/HUD/Art/;
    }
    *{box-sizing:border-box} html,body{height:100%;margin:0;background:#111;overflow:hidden;font-family:Tahoma,"Microsoft YaHei",Arial,sans-serif;color:#f5ecd2}
    .stage{position:relative;width:100vw;height:100vh;min-height:560px;overflow:hidden;background:#635a3d;isolation:isolate}
    .stage:before{content:"";position:absolute;inset:-8%;background:
      radial-gradient(ellipse at 50% 45%,rgba(115,102,70,.75),transparent 48%),
      radial-gradient(circle at 73% 28%,rgba(29,92,35,.9) 0 8%,transparent 17%),
      radial-gradient(circle at 78% 36%,rgba(19,83,32,.85) 0 9%,transparent 18%),
      radial-gradient(circle at 54% 78%,rgba(30,100,37,.9) 0 7%,transparent 16%),
      radial-gradient(circle at 91% 76%,rgba(35,93,40,.9) 0 12%,transparent 24%),
      linear-gradient(120deg,#665c40,#827350 40%,#5f563d 75%,#3e3a27);
      filter:contrast(1.25) saturate(.9);}
    .stage:after{content:"";position:absolute;inset:0;opacity:.18;mix-blend-mode:multiply;background-image:radial-gradient(#1e1b12 1px,transparent 1px),radial-gradient(#b7a77a 1px,transparent 1px);background-size:9px 9px,17px 17px;background-position:0 0,5px 7px}
    .tree{position:absolute;border-radius:50%;filter:drop-shadow(0 6px 4px #1b160b);z-index:1;background:radial-gradient(circle at 40% 35%,#56a63d 0 18%,#2e6e2f 36%,#173e1c 65%,transparent 68%)}
    .tree.t1{width:220px;height:150px;right:-35px;top:86px}.tree.t2{width:235px;height:170px;right:45px;top:205px}.tree.t3{width:205px;height:150px;left:650px;bottom:40px}.tree.t4{width:120px;height:110px;right:5px;bottom:0}
    .hero{position:absolute;left:50.8%;top:48%;width:42px;height:62px;z-index:3;transform:translate(-50%,-50%)}
    .hero:before{content:"";position:absolute;left:14px;top:6px;width:15px;height:15px;border-radius:50%;background:#e0c8a1;box-shadow:0 15px 0 #20365b,0 31px 0 #d7d6c7}.hero:after{content:"";position:absolute;left:-8px;top:24px;width:60px;height:7px;background:linear-gradient(90deg,transparent,#cfd8e9 25%,#647ea5 40%,#d9d9d9 56%,transparent);transform:rotate(-28deg);filter:drop-shadow(0 1px 1px #000)}
    .npc{position:absolute;right:220px;top:43%;width:30px;height:52px;z-index:3}.npc:before{content:"";position:absolute;left:7px;top:0;width:16px;height:48px;border-radius:45% 45% 30% 30%;background:linear-gradient(#f0f0ff,#b9b7dc 45%,#eee);box-shadow:0 8px 12px #0008}
    .top-left{position:absolute;left:13px;top:7px;z-index:5;font-size:13px;color:#48f7c6;text-shadow:1px 1px #001}.rank{display:inline-flex;align-items:center;margin-left:8px;color:#fff}.rank:before{content:"★";color:#f5d255;margin-right:3px}
    .status{position:absolute;left:260px;top:8px;width:500px;height:36px;z-index:5}.bar{position:relative;width:292px;height:12px;margin:0 auto 2px;border:1px solid #101010;background:#17120b;box-shadow:0 0 0 1px #7a5a32,inset 0 1px 2px #000}.bar i{display:block;height:100%;box-shadow:inset 0 1px rgba(255,255,255,.45)}.bar.hp i{width:86%;background:linear-gradient(#ff7676,#b41010)}.bar.mp i{width:73%;background:linear-gradient(#8eb7ff,#204bd0)}.bar.sp i{width:44%;background:linear-gradient(#9dff9b,#22912b)}.bar span{position:absolute;inset:0;text-align:center;font-size:10px;line-height:11px;color:#fff;text-shadow:1px 1px #000}
    .top-actions{position:absolute;left:705px;top:29px;z-index:5;display:grid;grid-template-columns:repeat(8,42px);gap:8px}.mini{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#e8d49b;font-size:20px;background:radial-gradient(circle at 35% 25%,#31413c,#070706 58%),linear-gradient(#e9c56d,#51300e);border:2px solid #bea463;box-shadow:0 0 0 2px #17100a,0 2px 5px #000}.mini:nth-child(1){background-image:url('../Assets/UI/HUD/Art/btn_status.png'),radial-gradient(circle,#2d312c,#050505);background-size:62%,100%;background-repeat:no-repeat;background-position:center}.mini:nth-child(2){background-image:url('../Assets/UI/HUD/Art/btn_items.png'),radial-gradient(circle,#2d312c,#050505);background-size:60%,100%;background-repeat:no-repeat;background-position:center}.mini:nth-child(3){background-image:url('../Assets/UI/HUD/Art/btn_skills.png'),radial-gradient(circle,#2d312c,#050505);background-size:62%,100%;background-repeat:no-repeat;background-position:center}
    .place{position:absolute;right:22px;top:9px;z-index:5;text-align:right;color:#6eff86;font-size:13px;text-shadow:1px 1px #001}.minimap{position:absolute;right:12px;top:30px;z-index:4;width:205px;height:145px;border-radius:4px;overflow:hidden;border:2px solid #312211;box-shadow:inset 0 0 0 1px #c1a162,0 2px 8px #0008;background:radial-gradient(circle at 65% 30%,#1b6b2d 0 9%,transparent 14%),radial-gradient(circle at 30% 70%,#2d7e31 0 12%,transparent 20%),linear-gradient(145deg,#806f45,#4c432d)}.minimap .coords{position:absolute;right:8px;bottom:5px;color:#39f1c3;font-size:12px}.minimap .icons{position:absolute;left:6px;bottom:4px;display:flex;gap:5px}.minimap b{display:block;width:16px;height:16px;border-radius:3px;background:#efe5bc;border:1px solid #291a0b}
    .joystick{position:absolute;left:54px;bottom:52px;z-index:6;width:190px;height:190px;border-radius:50%;background:radial-gradient(circle,#50351d 0 13%,#140d08 14% 20%,#49331f 21% 22%,#17110c 23% 51%,#5b432a 52% 54%,#0a0705 55%);border:2px solid #9f7b4c;box-shadow:0 0 0 4px #0b0906,0 6px 15px #000a}.joystick:before,.joystick:after{content:"";position:absolute;inset:22px;border-radius:50%;border:1px solid #806848}.joystick:after{inset:58px;background:radial-gradient(circle,#9b6936,#25150c 65%);box-shadow:inset 0 0 12px #000}.d{position:absolute;color:#d9c396;font-size:20px;text-shadow:1px 1px #000}.d.n{left:88px;top:20px}.d.s{left:89px;bottom:18px}.d.e{right:20px;top:85px}.d.w{left:20px;top:85px}
    .bottom-tools{position:absolute;left:50%;bottom:54px;transform:translateX(-50%);z-index:6;display:flex;gap:10px}.tool{width:44px;height:44px;border-radius:50%;border:2px solid #b99a5a;background:#16130e;box-shadow:0 0 0 2px #050505,0 4px 7px #0008;background-repeat:no-repeat;background-position:center;background-size:55%}.tool:nth-child(1){background-image:url('../Assets/UI/HUD/Art/btn_skills.png')}.tool:nth-child(2){background-image:url('../Assets/UI/HUD/Art/btn_items.png')}.tool:nth-child(3){background-image:url('../Assets/UI/HUD/Art/btn_team.png')}.tool:nth-child(4){background-image:url('../Assets/UI/HUD/Art/btn_chatroom.png')}.tool:nth-child(5){background-image:url('../Assets/UI/HUD/Art/btn_options.png')}.tool:nth-child(6){background-image:url('../Assets/UI/HUD/Art/btn_friend.png')}
    .chat{position:absolute;left:50%;bottom:0;transform:translateX(-50%);z-index:5;width:420px;height:82px;padding:8px 16px;background:linear-gradient(90deg,transparent,#100d09 12%,#100d09 88%,transparent);border-top:1px solid #7b6340;color:#f1e7c1;font-size:13px;line-height:18px;text-shadow:1px 1px #000}.chat .sys{color:#ffdf80}.chat .team{color:#9fd5ff}.chat .chatline{color:#f1c8a6}
    .skills{position:absolute;right:36px;bottom:32px;z-index:7;width:230px;height:230px}.skill{position:absolute;width:70px;height:70px;border-radius:50%;display:grid;place-items:center;color:#ffe6a6;font-size:30px;background:radial-gradient(circle at 35% 22%,#fff4a8 0 4%,#db701e 18%,#4b1207 58%,#160705 70%);border:3px solid #e7c06a;box-shadow:0 0 0 3px #110906,0 4px 11px #000}.skill.main{right:42px;bottom:32px;width:98px;height:98px;font-size:40px;background:radial-gradient(circle at 35% 25%,#fff1a0 0 5%,#de8130 17%,#bb260a 48%,#2a0904 72%)}.skill.s1{right:88px;bottom:142px}.skill.s2{right:0;bottom:128px}.skill.s3{right:150px;bottom:68px}.skill.s4{right:70px;bottom:0}.skill.s5{right:178px;bottom:0}.skill .glyph{filter:drop-shadow(0 2px 1px #000)}
    .caption{position:absolute;left:10px;bottom:8px;z-index:8;color:#6ef0d0;font-size:11px;opacity:.85}.ref{position:absolute;right:10px;bottom:8px;z-index:8;color:#d9c396;font-size:11px;opacity:.6}
    @media (max-width:900px){.stage{min-height:0}.status{left:180px;transform:scale(.78);transform-origin:top left}.top-actions{left:50%;transform:translateX(-28%) scale(.72);transform-origin:top left}.minimap{transform:scale(.72);transform-origin:top right}.joystick{transform:scale(.68);transform-origin:bottom left}.skills{transform:scale(.72);transform-origin:bottom right}.chat{width:330px;font-size:11px}.bottom-tools{transform:translateX(-50%) scale(.78)}}
  </style>
</head>
<body>
  <main class="stage" aria-label="Mobile Wuxia ARPG HUD Layout">
    <div class="tree t1"></div><div class="tree t2"></div><div class="tree t3"></div><div class="tree t4"></div>
    <div class="top-left">Hoạt động tốt 07 <span class="rank">Cấp</span></div>
    <section class="status" aria-label="Player status bars">
      <div class="bar hp"><i></i><span>207/207</span></div>
      <div class="bar mp"><i></i><span>222/222</span></div>
      <div class="bar sp"><i></i><span>44/44</span></div>
    </section>
    <nav class="top-actions" aria-label="Top quick menu">
      <button class="mini" title="Nhân vật"></button><button class="mini" title="Túi đồ"></button><button class="mini" title="Kỹ năng"></button><button class="mini">⚔</button><button class="mini">☯</button><button class="mini">▶</button><button class="mini">◈</button><button class="mini">✹</button>
      <button class="mini">🗡</button><button class="mini">☄</button><button class="mini">☂</button><button class="mini">♞</button><button class="mini">⚙</button><button class="mini">☷</button><button class="mini">◎</button><button class="mini">✦</button>
    </nav>
    <div class="place">Ba Lăng huyện</div>
    <aside class="minimap"><div class="icons"><b></b><b></b><b></b></div><div class="coords">220/203 Tân</div></aside>
    <div class="hero"></div><div class="npc"></div>
    <div class="joystick" aria-label="Movement joystick"><span class="d n">⌃</span><span class="d s">⌄</span><span class="d e">›</span><span class="d w">‹</span></div>
    <nav class="bottom-tools" aria-label="Bottom menu"><button class="tool"></button><button class="tool"></button><button class="tool"></button><button class="tool"></button><button class="tool"></button><button class="tool"></button></nav>
    <section class="chat" aria-label="Chat feed">
      <div><span class="sys">[Hệ thống]</span> Chánh luận diễn</div>
      <div><span class="team">[Soap]</span> Chánh thương tỷ 2</div>
      <div><span class="chatline">[Soap]</span> Đề phòng lô để mất bình.</div>
    </section>
    <section class="skills" aria-label="Combat skills">
      <button class="skill s1"><span class="glyph">♨</span></button><button class="skill s2"><span class="glyph">🔥</span></button><button class="skill s3"><span class="glyph">☽</span></button><button class="skill s4"><span class="glyph">♞</span></button><button class="skill s5"><span class="glyph">⚡</span></button><button class="skill main"><span class="glyph">╲</span></button>
    </section>
    <div class="caption">Classic V2 HUD mock — HTML/CSS recreation from Stitch screen</div>
    <div class="ref">Project 12426770499803462933 · Screen 34fc0413483548ebab83752d8a1271c3</div>
  </main>
</body>
</html>
