status_definitions:
  verified: Evidence và acceptance test đã kiểm tra; có thể làm baseline.
  provisional: Có evidence một phần; mapping hoặc runtime behavior còn phải audit.
  design: Hợp đồng to-be đã quyết định, chưa phải capability hiện hữu.
  not_started: Chưa có artifact triển khai hoặc kiểm chứng.
  blocked: Không thể hoàn tất nếu blocker ghi kèm chưa được giải quyết.

priority_definitions:
  P0: Bắt buộc cho internal pilot.
  P1: Sau pilot, cần trước content mở rộng/co-op.
  P2: Tùy chọn sau khi evidence đủ.
  P3: Chỉ làm khi có quyết định sản phẩm và evidence.

confidence_definitions:
  verified-document: Tài liệu/claim có location rõ; runtime behavior vẫn theo caveat của document evidence.
  verified-decision: Quyết định phạm vi đã được ghi trong corpus/docs.
  verified-runtime: Runtime observation có command/time/container; không mở rộng beyond observed fact.
  policy: Quy tắc bắt buộc của skill/source hierarchy, chưa phải asset selection result.
  verified-local: Artifact local đã quan sát; không đồng nghĩa game capability.
  provisional: Evidence/mapping một phần, cần audit thêm.

global_blockers:
  - id: B-LEGAL-001
    description: Quyền dùng/phân phối asset JX và DHCD chưa được xác minh.
  - id: B-EVIDENCE-001
    description: Nhiều mapping PC asset/NPC/item chưa có resolver proof đầy đủ.
  - id: B-REVERSE-001
    description: Card count/weight/cost/cap, pause, reconnect và mode DHCD chưa recovered đầy đủ.
  - id: B-SERVER-001
    description: Go server, PostgreSQL schema, WSS và deployment artifact chưa tồn tại.

