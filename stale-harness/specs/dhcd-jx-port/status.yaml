pilot_exit_policy:
  required_status_for_runtime_deliverables: verified
  pilot_distribution:
    channel: internal_only
    public_distribution: prohibited
    applies_regardless_of_legal_status: true
    internal_approval_required: true
  legal_internal_only_policy:
    document: DOC-RES-03
    allowed_status_after_scoped_approval: provisional
    required_evidence: scoped_approval_with_owner_expiry_and_no_public_distribution
    transition: "blocked -> provisional khi approval còn hạn; provisional -> blocked ngay khi hết hạn hoặc scope thay đổi"
    public_distribution_requires: legal-clearance-status-cleared_and_post_pilot_release_approval

document_record_defaults:
  acceptance_ref: "Xem mục Acceptance/Acceptance gate trong shard; governance/template dùng policy review."
  adr: []
  confidence: provisional
  source_version_hash: "[CẦN XÁC NHẬN]"
  verification:
    checked_at: "2026-07-15"
    result: "structure-reviewed; implementation-not_started"
document_record_schema:
  required_fields:
    - id
    - path
    - status
    - priority
    - owner
    - reviewer
    - blockers
    - dependencies
    - evidence
    - confidence
    - source_version_hash
    - acceptance_ref
    - adr
    - verification
  resolution: "Field ghi trực tiếp trong record documents có precedence cao nhất; field còn thiếu resolve từ document_provenance[id], rồi mới dùng document_record_defaults. Sau khi resolve, mọi required field phải hiện hữu; placeholder không được chuyển thành verified."
  confidence_allowed: [verified-document, verified-decision, verified-runtime, policy, verified-local, provisional]
  source_version_hash_rule: "Asset dùng exact version/load-order/sha256 từ manifest; source/document dùng version hoặc sha256 nếu có; pure design ghi design-only; [CẦN XÁC NHẬN] chỉ hợp lệ cho not_started/blocked/provisional."
  source_pin_encoding: "Giá trị dạng E-* là reference tới evidence record; evidence record/manifest phải resolve tiếp tới version hoặc SHA-256 cụ thể trước khi status verified. Policy snapshot dùng format policy:<stable-id>@<YYYY-MM-DD>; đây là version của policy, không phải asset selection."
  provenance_index: document_provenance

