schema_version: 1
package_id: SPEC-JX-PC-MOBILE-001
policy: owned-paths-only
purpose: >-
  Giới hạn phạm vi thay đổi được phép khi hoàn thiện specs; không xác nhận trạng
  thái sạch hoặc attribution của toàn worktree.
allowed_paths:
  - path: harness/specs/jx-pc-mobile-port/**
    owner: spec-orchestrator
    access: write
  - path: harness/scripts/generate-jx-spec-catalog.py
    owner: content-parity
    access: write
  - path: harness/scripts/spec-validator/**
    owner: spec-validator
    access: write
forbidden_paths:
  - path: Assets/Scripts/Sandbox/SkillEffectVisualService.cs
    reason: Unity brownfield ngoài phạm vi specs
  - path: Assets/Scripts/UI/SkillEffectRenderer.cs
    reason: Unity brownfield ngoài phạm vi specs
  - path: harness/specs/dhcd-jx-port/**
    reason: Bộ specs khác, phải bảo toàn
  - path: /var/www/jx-source/**
    reason: Corpus PC chỉ đọc
audit_semantics:
  claim: LIMITED_TO_OWNED_PATHS
  requires_wave_diff_evidence: true
  whole_worktree_clean_claim_allowed: false
  preexisting_or_external_dirty_paths: UNATTRIBUTED_OUT_OF_SCOPE
  outside_allowlist_action: FAIL_AND_ROUTE_TO_OWNER
  revert_unattributed_changes: false
